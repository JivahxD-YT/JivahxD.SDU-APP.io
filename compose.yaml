services:
  db:
    build:
      context: ./Database-SDU
      dockerfile: Dockerfile
    container_name: SDU-db
    environment:
      POSTGRES_DB: sdu
      POSTGRES_USER: sdu
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdu -d sdu"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    container_name: SDU-backend
    build:
      context: ./Backend-SDU
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/sdu
      DATABASE_USERNAME: sdu
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD}
      SDU_ADMIN_USERNAME: ${SDU_ADMIN_USERNAME:?Define SDU_ADMIN_USERNAME}
      SDU_ADMIN_PASSWORD: ${SDU_ADMIN_PASSWORD:?Define SDU_ADMIN_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: SDU-frontend
    build:
      context: ./Frontend-SDU
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
