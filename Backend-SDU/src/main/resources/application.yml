spring:
  application:
    name: sistema-denuncias-universitario
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sdu}
    username: ${DATABASE_USERNAME:sdu}
    password: ${DATABASE_PASSWORD:sdu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    error:
      include-message: never
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://jivahxd-yt.github.io}
  admin:
    username: ${SDU_ADMIN_USERNAME:}
    password: ${SDU_ADMIN_PASSWORD:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    poll-interval: ${TELEGRAM_POLL_INTERVAL:30000}
    poll-initial-delay: ${TELEGRAM_POLL_INITIAL_DELAY:0}
